name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      scheme:
        description: "Shared Xcode scheme to build and test"
        required: false
        default: "ScholarMark"
      xcode_version:
        description: "Xcode version installed on the runner image (must be 26 or newer)"
        required: false
        default: "26.6"
      capture_screenshots:
        description: "Also capture App Store screenshots in simulators (uploaded as an artifact)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Inputs are empty on pull_request, so fall back to the pinned defaults.
  SCHEME: ${{ inputs.scheme || 'ScholarMark' }}
  XCODE_VERSION: ${{ inputs.xcode_version || '26.6' }}
  MIN_XCODE_MAJOR: "26"
  IOS_ROOT: ios
  NSUnbufferedIO: "YES"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  listing:
    name: App Store listing and screenshot checks
    # Plain Node, no Xcode: checks ios/AppStore/metadata against Apple's limits and tests the
    # screenshot checker.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check listing metadata
        run: node ios/Tools/check-app-store-metadata.mjs

      - name: Test the App Store tools
        run: node --test ios/Tools/app-store-tools.test.mjs

  core-packages:
    name: swift test (local packages)
    # Pinned image label (arm64); never macos-latest, so Xcode/SDK changes are deliberate.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image. Available:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$app/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
          if (( major < MIN_XCODE_MAJOR )); then
            echo "::error::Xcode ${major} is older than the required Xcode ${MIN_XCODE_MAJOR}."
            exit 1
          fi
          swift --version

      - name: Run swift test for each package under ios/
        run: |
          if [[ ! -d "$IOS_ROOT" ]]; then
            echo "::error::Directory '$IOS_ROOT' does not exist on this ref."
            exit 1
          fi
          packages=()
          while IFS= read -r manifest; do
            packages+=("$(dirname "$manifest")")
          done < <(find "$IOS_ROOT" -maxdepth 3 -name Package.swift \
                     -not -path '*/.build/*' -not -path '*/.swiftpm/*' -not -path '*/DerivedData/*' | sort)

          if (( ${#packages[@]} == 0 )); then
            echo "::notice::No Package.swift found under $IOS_ROOT; nothing to run."
            exit 0
          fi

          failed=()
          for pkg in "${packages[@]}"; do
            echo "::group::swift test --package-path $pkg"
            if swift test --package-path "$pkg" --parallel; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::swift test failed for package $pkg"
              failed+=("$pkg")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "Failed packages: ${failed[*]}"
            exit 1
          fi

  app:
    name: xcodebuild test (${{ inputs.scheme || 'ScholarMark' }})
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DERIVED_DATA: build/DerivedData
      RESULTS_DIR: build/results
      LOGS_DIR: build/logs
      ARCHIVE_PATH: build/Release/ScholarMark.xcarchive
      # What the App Store build must be. Versions come from the Release build settings.
      RELEASE_BUNDLE_ID: ai.scholarmark.ios
      PRIVACY_MANIFEST_SOURCE: ios/ScholarMark/PrivacyInfo.xcprivacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image. Available:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$app/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
          if (( major < MIN_XCODE_MAJOR )); then
            echo "::error::Xcode ${major} is older than the required Xcode ${MIN_XCODE_MAJOR}."
            exit 1
          fi
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: $sdk"
          if (( ${sdk%%.*} < MIN_XCODE_MAJOR )); then
            echo "::error::iOS Simulator SDK $sdk is older than iOS ${MIN_XCODE_MAJOR}."
            exit 1
          fi

      - name: Discover Xcode project
        id: discover
        run: |
          if [[ ! -d "$IOS_ROOT" ]]; then
            echo "::error::Directory '$IOS_ROOT' does not exist on this ref."
            exit 1
          fi
          # Runner bash is 3.2: no mapfile, so results are newline-separated strings.
          prune=(-not -path '*/.build/*' -not -path '*/.swiftpm/*' -not -path '*/DerivedData/*' -not -path '*/Pods/*')
          count() { if [[ -z "$1" ]]; then echo 0; else printf '%s\n' "$1" | wc -l | tr -d ' '; fi; }

          # XcodeGen spec is the source of truth when present; regenerate the project from it.
          specs="$(find "$IOS_ROOT" -maxdepth 3 -name project.yml "${prune[@]}" | sort)"
          if (( $(count "$specs") > 1 )); then
            echo "::error::Found multiple XcodeGen specs; expected at most one:"
            echo "$specs"
            exit 1
          fi
          if (( $(count "$specs") == 1 )); then
            spec="$specs"
            if ! command -v xcodegen >/dev/null 2>&1; then
              echo "::group::brew install xcodegen"
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
              echo "::endgroup::"
            fi
            xcodegen --version
            (cd "$(dirname "$spec")" && xcodegen generate --spec "$(basename "$spec")")
          fi

          # Prefer a standalone workspace; ignore the one embedded in every .xcodeproj.
          workspaces="$(find "$IOS_ROOT" -maxdepth 4 -name '*.xcworkspace' \
                          -not -path '*.xcodeproj/*' "${prune[@]}" | sort)"
          projects="$(find "$IOS_ROOT" -maxdepth 4 -name '*.xcodeproj' "${prune[@]}" | sort)"

          if (( $(count "$workspaces") == 1 )); then
            flag="-workspace"; container="$workspaces"
          elif (( $(count "$workspaces") > 1 )); then
            echo "::error::Found multiple workspaces; expected one:"
            echo "$workspaces"
            exit 1
          elif (( $(count "$projects") == 1 )); then
            flag="-project"; container="$projects"
          elif (( $(count "$projects") > 1 )); then
            echo "::error::Found multiple .xcodeproj bundles and no workspace:"
            echo "$projects"
            exit 1
          else
            echo "::error::No .xcodeproj, .xcworkspace, or XcodeGen project.yml found under $IOS_ROOT."
            exit 1
          fi
          echo "Using $flag $container"

          # The scheme must be shared (checked in), otherwise CI only sees autogenerated schemes.
          shared="$(find "$IOS_ROOT" -path '*/xcshareddata/xcschemes/*.xcscheme' "${prune[@]}" | sort)"
          if ! printf '%s\n' "$shared" | grep -Fq "/xcshareddata/xcschemes/${SCHEME}.xcscheme"; then
            echo "::error::Shared scheme '${SCHEME}' not found (expected xcshareddata/xcschemes/${SCHEME}.xcscheme)."
            echo "Shared schemes found:"
            echo "${shared:-<none>}"
            exit 1
          fi

          list_json="$(xcodebuild -list -json "$flag" "$container")"
          if ! jq -e --arg s "$SCHEME" '[(.workspace // .project).schemes[]] | index($s)' <<<"$list_json" >/dev/null; then
            echo "::error::xcodebuild -list does not report scheme '${SCHEME}' for $container."
            jq '(.workspace // .project).schemes' <<<"$list_json"
            exit 1
          fi

          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "container=$container" >> "$GITHUB_OUTPUT"

      - name: Select iPhone simulator
        id: simulator
        run: |
          devices_json="$(xcrun simctl list devices available --json)"
          # Highest installed iOS runtime, then the first iPhone by name for a stable choice.
          pick="$(jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+(-[0-9]+)*$"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $ver
              | .value[]
              | select(.isAvailable == true and (.name | startswith("iPhone")))
              | { udid, name, ver: $ver } ]
            | sort_by(.ver, .name)
            | (map(.ver) | max) as $top
            | map(select(.ver == $top))
            | first // empty
            | "\(.udid)\t\(.name)\t\(.ver | map(tostring) | join("."))"
          ' <<<"$devices_json")"
          if [[ -z "$pick" ]]; then
            echo "::error::No available iPhone simulator found for the selected Xcode."
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi
          IFS=$'\t' read -r udid name version <<<"$pick"
          echo "Selected $name (iOS $version) $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "description=$name (iOS $version)" >> "$GITHUB_OUTPUT"
          # Boot up front so a broken simulator fails here, not midway through the test run.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        env:
          FLAG: ${{ steps.discover.outputs.flag }}
          CONTAINER: ${{ steps.discover.outputs.container }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR"
          # Simulator-only, ad-hoc signing: no team, certificates, or provisioning profiles.
          xcodebuild build-for-testing \
            "$FLAG" "$CONTAINER" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/build.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$LOGS_DIR/build.log" | xcbeautify --renderer github-actions

      - name: Test
        env:
          FLAG: ${{ steps.discover.outputs.flag }}
          CONTAINER: ${{ steps.discover.outputs.container }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test-without-building \
            "$FLAG" "$CONTAINER" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/test.xcresult" \
            2>&1 | tee "$LOGS_DIR/test.log" | xcbeautify --renderer github-actions

      # The simulator steps above never build for a real device. This archives the same checkout
      # the way App Store builds are made (Release, generic iOS device) but with signing turned
      # off: no team, certificate, profile, or secret is involved, and nothing is uploaded to
      # Apple. An unsigned archive cannot be submitted, so the archive itself is not kept; its
      # build log, result bundle, and the check report below are uploaded with the other logs.
      - name: Archive Release for a generic iOS device (unsigned)
        env:
          FLAG: ${{ steps.discover.outputs.flag }}
          CONTAINER: ${{ steps.discover.outputs.container }}
        run: |
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR"
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcodebuild archive \
            "$FLAG" "$CONTAINER" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/archive.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$LOGS_DIR/archive.log" | xcbeautify --renderer github-actions

      - name: Check the Release archive
        env:
          FLAG: ${{ steps.discover.outputs.flag }}
          CONTAINER: ${{ steps.discover.outputs.container }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          report="$LOGS_DIR/archive-check.log"
          failures=0
          pass() { echo "PASS $*" | tee -a "$report"; }
          fail() { echo "::error::Release archive: $*"; echo "FAIL $*" >> "$report"; failures=$((failures + 1)); }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2" 2>/dev/null || true; }
          {
            echo "Release archive check"
            echo "Candidate commit: $HEAD_SHA"
            echo "Checked out: $(git rev-parse HEAD) (ios/ tree $(git rev-parse HEAD:ios))"
            echo "Xcode: $(xcodebuild -version | paste -sd ' ' -); iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          } > "$report"

          apps="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -type d 2>/dev/null || true)"
          if [[ -z "$apps" || "$(printf '%s\n' "$apps" | wc -l | tr -d ' ')" != 1 ]]; then
            echo "::error::Expected exactly one .app in $ARCHIVE_PATH/Products/Applications, found: ${apps:-none}"
            exit 1
          fi
          app="$apps"
          info="$app/Info.plist"
          exe="$app/$(plist CFBundleExecutable "$info")"
          echo "App: ${app#"$ARCHIVE_PATH/"}" >> "$report"

          # Expected values: the Release build settings of the app target.
          settings="$(xcodebuild -showBuildSettings -json "$FLAG" "$CONTAINER" -scheme "$SCHEME" \
                        -configuration Release -destination 'generic/platform=iOS' \
                      | jq '[.[] | select(.buildSettings.WRAPPER_EXTENSION == "app")][0].buildSettings // {}')"
          setting() { jq -r --arg k "$1" '.[$k] // ""' <<<"$settings"; }

          # 1. Built for real devices: iphoneos SDK, arm64 only, LC_BUILD_VERSION platform IOS.
          value="$(plist DTPlatformName "$info")"
          if [[ "$value" == iphoneos ]]; then pass "DTPlatformName is iphoneos"
          else fail "DTPlatformName is '$value', expected iphoneos"; fi
          value="$(plist CFBundleSupportedPlatforms:0 "$info")"
          if [[ "$value" == iPhoneOS ]]; then pass "CFBundleSupportedPlatforms is iPhoneOS"
          else fail "CFBundleSupportedPlatforms is '$value', expected iPhoneOS"; fi
          if [[ -f "$exe" ]]; then
            value="$(lipo -archs "$exe")"
            if [[ "$value" == arm64 ]]; then pass "executable architectures: $value"
            else fail "executable architectures are '$value', expected arm64"; fi
            value="$(xcrun vtool -show-build "$exe" | awk '$1 == "platform" { print $2 }' | sort -u | paste -sd ' ' -)"
            if [[ "$value" == IOS ]]; then pass "LC_BUILD_VERSION platform: $value"
            else fail "LC_BUILD_VERSION platform is '$value', expected IOS (not IOSSIMULATOR)"; fi
          else
            fail "executable '$exe' is missing"
          fi
          value="$(plist MinimumOSVersion "$info")"
          if [[ -n "$value" && "$value" == "$(setting IPHONEOS_DEPLOYMENT_TARGET)" ]]; then pass "MinimumOSVersion $value"
          else fail "MinimumOSVersion '$value' does not match IPHONEOS_DEPLOYMENT_TARGET '$(setting IPHONEOS_DEPLOYMENT_TARGET)'"; fi

          # 2. Identity: bundle ID (in the app and the archive's Info.plist) and versions.
          value="$(plist CFBundleIdentifier "$info")"
          archived="$(plist ApplicationProperties:CFBundleIdentifier "$ARCHIVE_PATH/Info.plist")"
          if [[ "$value" == "$RELEASE_BUNDLE_ID" && "$archived" == "$RELEASE_BUNDLE_ID" ]]; then pass "bundle ID $value"
          else fail "bundle ID is '$value' (archive '$archived'), expected $RELEASE_BUNDLE_ID"; fi
          value="$(plist CFBundleShortVersionString "$info")"
          if [[ -n "$value" && "$value" == "$(setting MARKETING_VERSION)" ]]; then pass "version $value"
          else fail "CFBundleShortVersionString '$value' does not match MARKETING_VERSION '$(setting MARKETING_VERSION)'"; fi
          value="$(plist CFBundleVersion "$info")"
          if [[ -n "$value" && "$value" == "$(setting CURRENT_PROJECT_VERSION)" ]]; then pass "build $value"
          else fail "CFBundleVersion '$value' does not match CURRENT_PROJECT_VERSION '$(setting CURRENT_PROJECT_VERSION)'"; fi

          # 3. Privacy manifest installed at the bundle root, identical to the checked-in file.
          manifest="$app/PrivacyInfo.xcprivacy"
          if [[ -f "$manifest" ]] && plutil -lint -s "$manifest" \
             && diff <(plutil -convert json -o - "$manifest") <(plutil -convert json -o - "$PRIVACY_MANIFEST_SOURCE") >/dev/null; then
            pass "PrivacyInfo.xcprivacy installed and matches $PRIVACY_MANIFEST_SOURCE"
          else
            fail "PrivacyInfo.xcprivacy is missing from the app bundle, invalid, or differs from $PRIVACY_MANIFEST_SOURCE"
          fi

          # 4. App icon compiled into the asset catalog and named as the primary icon.
          value="$(plist CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName "$info")"
          if [[ -f "$app/Assets.car" && "$value" == AppIcon ]] \
             && xcrun assetutil --info "$app/Assets.car" | jq -e 'any(.[]; .Name? == "AppIcon")' >/dev/null; then
            pass "AppIcon is in Assets.car and is the primary icon"
          else
            fail "AppIcon missing: Assets.car present=$([[ -f "$app/Assets.car" ]] && echo yes || echo no), CFBundleIconName='$value'"
          fi

          # 5. The DEBUG-only screenshot mode (Support/ScreenshotMode.swift) is not in the binary.
          #    A string every Release build has is the positive control, so "not found" means absent.
          if [[ -f "$exe" ]] && grep -a -q -F "Lookups never send your library" "$exe"; then
            leaked=""
            for marker in "ScreenshotScene" "-ScholarMarkScreenshot" "HIST 210: Memory & the Archive" "10.5555/jap.2022.0182"; do
              if grep -a -q -F -- "$marker" "$exe"; then leaked="$leaked '$marker'"; fi
            done
            if [[ -z "$leaked" ]]; then pass "no screenshot-mode code or sample data in the executable"
            else fail "screenshot-mode markers found in the Release executable:$leaked"; fi
          else
            fail "a known UI string is not in the executable, so the screenshot-mode scan cannot be trusted"
          fi

          # 6. Unsigned by design. The arm64 linker ad-hoc signs every executable, so look for a
          #    real signing identity, a bundle signature, or a profile rather than any signature.
          if [[ ! -e "$app/_CodeSignature" && ! -e "$app/embedded.mobileprovision" ]] \
             && ! codesign -dvv "$app" 2>&1 | grep -q '^Authority='; then
            pass "not signed with an identity, no bundle signature or provisioning profile"
          else
            fail "the app carries a signature or provisioning profile; this job must not sign"
          fi

          echo "Failures: $failures" >> "$report"
          if (( failures > 0 )); then exit 1; fi

      - name: Summarize results
        if: always()
        env:
          SIMULATOR: ${{ steps.simulator.outputs.description }}
        run: |
          {
            echo "## iOS: scheme \`${SCHEME}\`"
            echo "- Xcode: $(xcodebuild -version | paste -sd ' ' -)"
            echo "- Simulator: ${SIMULATOR:-not selected}"
            if [[ -d "$RESULTS_DIR/build.xcresult" ]]; then
              echo "### Build"
              echo '```'
              xcrun xcresulttool get build-results --path "$RESULTS_DIR/build.xcresult" 2>&1 | head -c 60000 || true
              echo '```'
            fi
            if [[ -d "$RESULTS_DIR/test.xcresult" ]]; then
              echo "### Tests"
              echo '```'
              xcrun xcresulttool get test-results summary --path "$RESULTS_DIR/test.xcresult" 2>&1 | head -c 60000 || true
              echo '```'
            fi
            if [[ -f "$LOGS_DIR/archive-check.log" ]]; then
              echo "### Release archive (generic iOS device, unsigned)"
              echo '```'
              cat "$LOGS_DIR/archive-check.log"
              echo '```'
            elif [[ -f "$LOGS_DIR/archive.log" ]]; then
              echo "### Release archive"
              echo "The archive build did not finish; see archive.log in the uploaded artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only result bundles and logs (including archive.log and archive-check.log); built .app
      # products in DerivedData and the unsigned .xcarchive are never uploaded.
      - name: Upload result bundles and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/results/*.xcresult
            build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: App Store screenshots (simulators)
    # Manual only: Actions > iOS > Run workflow > "Also capture App Store screenshots".
    if: github.event_name == 'workflow_dispatch' && inputs.capture_screenshots
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SHOTS_DIR: build/AppStoreScreenshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image. Available:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          sudo xcode-select --switch "$app/Contents/Developer"
          xcodebuild -version
          node --version

      - name: Generate the Xcode project from project.yml
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          (cd "$IOS_ROOT" && xcodegen generate --spec project.yml)

      - name: Capture screenshots
        run: ios/Tools/capture-app-store-screenshots.sh "$SHOTS_DIR"

      - name: Summarize screenshots
        if: always()
        run: |
          {
            echo "## App Store screenshots"
            echo "Synthetic sample data, Debug build, $(xcodebuild -version | paste -sd ' ' -)."
            echo '```'
            if [[ -d "$SHOTS_DIR" ]]; then
              node ios/Tools/check-app-store-screenshots.mjs --require iphone-6.3,ipad-13 "$SHOTS_DIR" 2>&1 || true
            else
              echo "No screenshots were captured."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/AppStoreScreenshots
          if-no-files-found: ignore
          retention-days: 14
