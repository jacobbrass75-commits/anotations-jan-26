# XcodeGen spec for the ScholarMark iOS companion.
# Regenerate the project with:  cd ios && xcodegen generate
# (brew install xcodegen). This overwrites ScholarMark.xcodeproj.
name: ScholarMark
options:
  bundleIdPrefix: ai.scholarmark
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  ScholarMarkCore:
    path: ScholarMarkCore

targets:
  ScholarMark:
    type: application
    platform: iOS
    sources:
      - path: ScholarMark
    dependencies:
      - package: ScholarMarkCore
        product: ScholarMarkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.scholarmark.ios
        PRODUCT_NAME: ScholarMark
        INFOPLIST_FILE: Config/ScholarMark-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScholarMark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  ScholarMark:
    build:
      targets:
        ScholarMark: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ScholarMarkCore/ScholarMarkCoreTests
    archive:
      config: Release
